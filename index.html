<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jellymonsters Web</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script>
    let imgs = [];
    let hornImgs = [];
    let currentHornIndex = 0;
    let mouthImgs = [];
    let mainMouth;
    let eyeImgs = [];
    let noseImgs = [];
    let currentImageIndex = 0;
    let currentEyeIndex = 0;
    let currentNoseIndex = 0;
    let noiseOffset = [];
    let currentHue = 0;

    let audioCtx, analyser, microphone, dataArray;
    let isAudioActive = false;

    const BASE_WIDTH = 500;
    const BASE_HEIGHT = 800;

    let lines = [
      { xOffset: 12, yStartOffset: -120, yEndOffset: 280 },
      { xOffset: 36, yStartOffset: -120, yEndOffset: 240 },
      { xOffset: 60, yStartOffset: -120, yEndOffset: 260 },
      { xOffset: -12, yStartOffset: -120, yEndOffset: 220 },
      { xOffset: -36, yStartOffset: -120, yEndOffset: 270 },
      { xOffset: -60, yStartOffset: -120, yEndOffset: 250 },
    ];

    let characterY = 0;
    let activeMouth = null;
    let mouthTimer = 0;
    let cnv;

    function getScaleFactor() {
      return width / BASE_WIDTH;
    }

    function preload() {
      for (let i = 1; i <= 4; i++) {
        imgs.push(loadImage(`assets/semi${i}.png`));
      }
      mainMouth = loadImage("assets/mouth.png");
      for (let i = 1; i <= 9; i++) {
        mouthImgs.push(loadImage(`assets/mouth${i}.png`));
      }
      for (let i = 1; i <= 4; i++) {
        eyeImgs.push(loadImage(`assets/eyes${i}.png`));
      }
      for (let i = 1; i <= 4; i++) {
        noseImgs.push(loadImage(`assets/nose${i}.png`));
      }
      for (let i = 1; i <= 4; i++) {
        hornImgs.push(loadImage(`assets/horns${i}.png`));
      }
    }

    function setup() {
      cnv = createCanvas(windowWidth, windowHeight);
      cnv.mousePressed(activateAudio);

      imageMode(CENTER);
      colorMode(HSB, 360, 100, 100);

      for (let i = 0; i < lines.length; i++) {
        noiseOffset[i] = random(1000);
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }

    function activateAudio() {
      if (!isAudioActive) {
        navigator.mediaDevices.getUserMedia({ audio: true, video: false })
          .then(stream => {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state !== 'running') {
              audioCtx.resume();
            }
            analyser = audioCtx.createAnalyser();
            microphone = audioCtx.createMediaStreamSource(stream);
            microphone.connect(analyser);
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            isAudioActive = true;
          })
          .catch(err => {
            console.error('Microphone permission denied or unavailable:', err);
          });
      } else {
        if (audioCtx && audioCtx.state !== 'running') {
          audioCtx.resume();
        }
      }
    }

    function draw() {
      clear();

      let scale = getScaleFactor();

      let yOffset = sin(frameCount * 0.05) * 8 * scale;
      characterY = lerp(characterY, yOffset, 0.4);

      let wiggleFactor = 0;
      let currentImageHue = 0;
      let eyeSize = 55 * scale;
      let loudness = 0;

      if (isAudioActive && analyser) {
        analyser.getByteFrequencyData(dataArray);

        // 1. Frequency (Bass) mapped to Color Hue
        let bassSum = 0;
        for (let i = 0; i < 8; i++) bassSum += dataArray[i];
        let bassEnergy = (bassSum / 8) * (360 / 255);
        currentHue = lerp(currentHue, bassEnergy, 0.1);
        currentImageHue = currentHue;

        // 2. Overall Loudness mapped to Wiggles, Eyes, and Mouth
        let totalSum = 0;
        for (let i = 0; i < dataArray.length; i++) totalSum += dataArray[i];
        loudness = totalSum / dataArray.length;

        // No idle wiggle: absolute silence = 0 wiggle, scaling up directly with sound
        wiggleFactor = map(loudness, 0, 55, 0, 25, true);

        // Mouth triggers on speech/noise
        let triggerThreshold = 10;
        if (activeMouth) {
          mouthTimer--;
          if (mouthTimer <= 0) activeMouth = null;
        } else if (loudness > triggerThreshold) {
          activeMouth = random(mouthImgs);
          mouthTimer = 120;
        }

        // Eye scaling tied to loudness
        let minEyeSize = 55 * scale;
        let maxEyeSize = 120 * scale;
        eyeSize = map(loudness, 0, 50, minEyeSize, maxEyeSize, true);
      } else {
        wiggleFactor = 0;
      }

      // LINES
      noFill();
      stroke('#dae6fe'); 
      strokeWeight(12 * scale);

      for (let i = 0; i < lines.length; i++) {
        let { xOffset, yStartOffset, yEndOffset } = lines[i];
        let x = width / 2 + (xOffset * scale);
        let baseYStart = height / 2 + (yStartOffset * scale);
        let baseYEnd = height / 2 + (yEndOffset * scale);

        beginShape();
        for (let y = baseYStart; y <= baseYEnd; y += (10 * scale)) {
          let effectiveY = y + characterY;
          let taperFactor = map(effectiveY, baseYStart + characterY, baseYEnd + characterY, 0, 1);
          let scaledWiggleFactor = wiggleFactor * pow(taperFactor, 0.5);
          let wiggle = (noise(noiseOffset[i] + effectiveY / scale * 0.005, frameCount * 0.1) - 0.5) * scaledWiggleFactor * (150 * scale);
          curveVertex(x + wiggle, effectiveY);
        }
        endShape();
      }

      // HORNS
      currentHornIndex = floor(frameCount / 5) % hornImgs.length;
      let hornImg = hornImgs[currentHornIndex];
      image(hornImg, width / 2, height / 2 + (-240 * scale) + characterY, (hornImg.width / 5) * scale, (hornImg.height / 5) * scale);

      // BODY
      tint(currentImageHue, 100, 100);
      currentImageIndex = floor(frameCount / 5) % imgs.length;
      currentNoseIndex = floor(frameCount / 5) % noseImgs.length;
      image(imgs[currentImageIndex], width / 2, height / 2 + (-180 * scale) + characterY, (imgs[currentImageIndex].width / 4.5) * scale, (imgs[currentImageIndex].height / 4.5) * scale);
      noTint();

      // MOUTH
      let mouthToShow = activeMouth ? activeMouth : mainMouth;
      let jiggleAmount = 2 * scale;
      let jiggleSpeed = 0.5;
      let jiggleX = (noise(frameCount * jiggleSpeed) - 0.5) * jiggleAmount * 2;
      let jiggleY = (noise(frameCount * jiggleSpeed + 1000) - 0.5) * jiggleAmount * 2;

      image(mouthToShow, width / 2 + jiggleX, height / 2 + (-195 * scale) + characterY + jiggleY, (mouthToShow.width / 5) * scale, (mouthToShow.height / 5) * scale);

      // NOSE
      let noseImg = noseImgs[currentNoseIndex];
      image(noseImg, width / 2, height / 2 + (-215 * scale) + characterY, (noseImg.width / 4.5) * scale, (noseImg.height / 4.5) * scale);

      // EYES
      currentEyeIndex = floor(frameCount / 5) % eyeImgs.length;
      let aspectRatio = eyeImgs[currentEyeIndex].width / eyeImgs[currentEyeIndex].height;
      let scaledHeight = eyeSize;
      let scaledWidth = scaledHeight * aspectRatio;

      image(
        eyeImgs[currentEyeIndex],
        width / 2,
        height / 2 + (-255 * scale) + characterY,
        scaledWidth,
        scaledHeight
      );

      // CLICK TO WAKE PROMPT (Disappears once audio is active)
      if (!isAudioActive) {
        push();
        textAlign(CENTER, CENTER);
        textSize(21 * scale);
        fill('#667799');
        noStroke();
        text("click to wake", width / 2, height / 2 - (320 * scale));
        pop();
      }
    }
  </script>
</body>
</html>
